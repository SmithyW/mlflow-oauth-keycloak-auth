[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlflow-oauth-keycloak-auth"
authors = [
  { name="SmithyW", email="github@smiwit.de" },
]
description = "Package for dealing with JWT tokens from Keycloak in a MLflow - oauth2-proxy setup."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENCE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["mlflow", "oauth2", "keycloak"]
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]
dynamic = [
  "version",
]

[project.urls]
Homepage = "https://github.com/SmithyW/mlflow-oauth-keycloak-auth"
Issues = "https://github.com/SmithyW/mlflow-oauth-keycloak-auth/issues"

[tool.hatch.version]
path = "src/mlflow_oauth_keycloak_auth/__about__.py"